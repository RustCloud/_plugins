# Builds index.json from sources.json and the plugins' releases, and commits
# it when it changed. Run it from the Actions tab; the schedule is off for now.
name: Update
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Update index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update.py
      - name: Commit
        run: |
          if git diff --quiet index.json; then
            echo "index.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898088+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update index.json" index.json
          git push
